<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TradeMemo · Incoterms 纯背诵看板</title>
<style>
:root{
  --bg:#f6f6f2; --panel:#fffdfa; --ink:#1f2b2a; --muted:#687675; --line:#e3e7e1;
  --seller:#182761; --buyer:#f57b74; --risk:#ffcb47; --accent:#1a7a62; --accent-soft:#d8efe8;
  --chip:#eef2ef; --white:#fff; --shadow:0 10px 32px rgba(18,48,44,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
button,input{font:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 40px}
.hero{background:linear-gradient(135deg,#fdfcf7,#f4faf7);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:32px;line-height:1.1}
.hero p{margin:6px 0;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.35fr .95fr;gap:18px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn,.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:9px 14px;cursor:pointer}
.btn.active,.chip.active{background:var(--accent-soft);border-color:#c8e4db;color:#135644;font-weight:700}
.btn:hover,.chip:hover{filter:brightness(.99)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0}
.leftTools,.rightTools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;min-width:220px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.swatch{width:22px;height:10px;border-radius:999px;display:inline-block}
.swatch.seller{background:var(--seller)} .swatch.buyer{background:var(--buyer)}
.dot{width:13px;height:13px;border-radius:50%;background:var(--risk);border:2px solid #8b6700;display:inline-block}
.board{display:grid;gap:10px}
.row{border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px;cursor:pointer;transition:.18s transform,.18s border-color,.18s box-shadow}
.row:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.05)}
.row.active{border-color:#badfd3;box-shadow:0 0 0 3px #e8f6f1 inset}
.rowTop{display:grid;grid-template-columns:90px minmax(170px,240px) minmax(120px,160px) 1fr;gap:12px;align-items:center}
.abbr{font-size:28px;font-weight:900;letter-spacing:.5px;color:#12225b}
.full{font-weight:800}
.cn{color:#164d41;font-weight:700}
.memline{font-size:14px;color:var(--muted);margin-top:6px}
.timelineWrap{margin-top:12px}
.stops{display:grid;grid-template-columns:repeat(8,1fr);font-size:11px;color:var(--muted);margin-bottom:6px;gap:4px}
.stops div{text-align:center}
.line{position:relative;height:24px;border-radius:999px;background:#f2f3f5;overflow:hidden;border:1px solid #e7eaee}
.sellerSeg,.buyerSeg{position:absolute;top:0;bottom:0}
.sellerSeg{left:0;background:var(--seller)}
.buyerSeg{right:0;background:var(--buyer)}
.riskMarker{position:absolute;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--risk);border:2px solid #8b6700;color:#5d4600;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.metaTag{background:#f8faf9;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;color:#405150}
.detail h2{margin:0 0 6px;font-size:26px}
.detail .subtitle{color:var(--muted);margin-bottom:14px}
.detailGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.infoBox{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}
.infoBox h3{margin:0 0 8px;font-size:15px}
.infoBox p,.infoBox li{margin:0;color:#334;}
.infoBox ul{margin:0;padding-left:18px}
.memorySentence{margin-top:14px;border-radius:18px;background:#f5faf8;border:1px solid #d7ebe4;padding:14px}
.memorySentence strong{display:block;margin-bottom:6px;color:#145b48}
.groupCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.groupCard{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}
.groupCard h3{margin:0 0 8px}
.groupCard p{margin:0;color:#566}
.footerNote{margin-top:18px;color:var(--muted);font-size:13px}
.hideCN .cn,.hideCN .detail-cn{display:none}
.hideHint .memline,.hideHint .memorySentence{display:none}
@media (max-width:1040px){.grid2{grid-template-columns:1fr}.rowTop{grid-template-columns:82px 1fr}.rowTop > :nth-child(3){grid-column:2}.rowTop > :nth-child(4){grid-column:1 / -1}.groupCards,.detailGrid{grid-template-columns:1fr}}
@media (max-width:640px){.hero h1{font-size:26px}.abbr{font-size:22px}.row{padding:12px}.stops{font-size:10px}.wrap{padding:14px 12px 30px}.search{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <section class="hero">
    <h1>TradeMemo · Incoterms 2020 纯背诵看板</h1>
    <p>不做题，只背诵。参考你 PPT 第31页的“总览式”结构，把 11 个术语做成一张可点击、可筛选、可切换显示内容的背诵板。</p>
    <p class="small">使用方式：先看总览 → 点一个术语聚焦 → 反复切换分组 / 运输方式 / 是否显示中文或记忆句。</p>
    <div class="controls" id="groupBtns"></div>
    <div class="toolbar">
      <div class="leftTools" id="modeBtns"></div>
      <div class="rightTools">
        <button class="chip active" id="toggleCN">显示中文</button>
        <button class="chip active" id="toggleHint">显示记忆句</button>
        <input class="search" id="search" placeholder="搜索 EXW / FOB / 货交承运人 / duty..." />
      </div>
    </div>
    <div class="legend">
      <span><i class="swatch seller"></i> 卖方责任区间</span>
      <span><i class="dot"></i> 风险转移点</span>
      <span><i class="swatch buyer"></i> 买方责任区间</span>
    </div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2 style="margin:0 0 6px">总览背诵板</h2>
      <p class="small" style="margin:0 0 14px">点击任意一行，可以在右侧看到清晰的背诵要点。</p>
      <div class="board" id="board"></div>
      <div class="footerNote">速记：E = 买方做得最多；F = 卖方把货交出去；C = 卖方付主运费，但风险转移更早；D = 卖方负责到目的地附近或目的地。</div>
    </section>

    <aside class="card detail" id="detail"></aside>
  </div>
</div>
<script>
const stops = ["卖方场所","第一承运人","装运港边","船上/装运港","主运输途中","目的港","目的地","目的地+税费"];
const terms = [
  {abbr:"EXW", full:"Ex Works", cn:"工厂交货", group:"E", mode:"any", risk:8, sellerEnd:8, delivery:"卖方场所备货即可", sellerPays:"几乎不承担后续运输", buyerDoes:"装车、出口、主运输、进口都主要由买方负责", point:"卖方责任最少", memory:"EXW = 出厂即交货，卖方最省事。"},
  {abbr:"FCA", full:"Free Carrier", cn:"货交承运人", group:"F", mode:"any", risk:18, sellerEnd:18, delivery:"货交给买方指定承运人", sellerPays:"负责到承运人接货前，并办理出口清关", buyerDoes:"主运输及后续由买方负责", point:"不限运输方式；卖方负责出口清关", memory:"FCA = 交给承运人，风险就转。"},
  {abbr:"FAS", full:"Free Alongside Ship", cn:"船边交货", group:"F", mode:"sea", risk:28, sellerEnd:28, delivery:"装运港船边", sellerPays:"负责把货送到船边并出口清关", buyerDoes:"装船和之后由买方负责", point:"仅适用于水运", memory:"FAS = 到船边，还没上船。"},
  {abbr:"FOB", full:"Free On Board", cn:"船上交货", group:"F", mode:"sea", risk:38, sellerEnd:38, delivery:"货物装上船时", sellerPays:"负责到装船完成，并出口清关", buyerDoes:"海运和之后由买方负责", point:"仅适用于水运；装上船才转风险", memory:"FOB = 上了船，风险转给买方。"},
  {abbr:"CFR", full:"Cost and Freight", cn:"成本加运费", group:"C", mode:"sea", risk:38, sellerEnd:62, delivery:"风险在装运港船上转移", sellerPays:"卖方支付运费到目的港", buyerDoes:"风险较早转移，但买方承担途中风险", point:"仅水运；卖方付运费，不负责保险", memory:"CFR = 卖方付运费，但风险上船就转。"},
  {abbr:"CIF", full:"Cost, Insurance and Freight", cn:"成本、保险加运费", group:"C", mode:"sea", risk:38, sellerEnd:62, delivery:"风险在装运港船上转移", sellerPays:"卖方支付运费并投保到目的港", buyerDoes:"承担较早转移后的风险", point:"仅水运；比 CFR 多一个保险", memory:"CIF = CFR + 保险。"},
  {abbr:"CPT", full:"Carriage Paid To", cn:"运费付至", group:"C", mode:"any", risk:18, sellerEnd:82, delivery:"第一承运人处转风险", sellerPays:"卖方支付运费到约定目的地", buyerDoes:"风险在起运地较早转移", point:"不限运输方式；像 any-mode 版 CFR", memory:"CPT = 风险早转，运费后付。"},
  {abbr:"CIP", full:"Carriage and Insurance Paid To", cn:"运费、保险费付至", group:"C", mode:"any", risk:18, sellerEnd:82, delivery:"第一承运人处转风险", sellerPays:"卖方支付运费并投保到约定目的地", buyerDoes:"承担较早转移后的风险", point:"不限运输方式；像 any-mode 版 CIF", memory:"CIP = CPT + 保险。"},
  {abbr:"DAP", full:"Delivered At Place", cn:"目的地交货", group:"D", mode:"any", risk:88, sellerEnd:88, delivery:"货到目的地、未卸货", sellerPays:"卖方承担运到目的地的费用和风险", buyerDoes:"卸货、进口清关及税费一般由买方处理", point:"未卸货是关键词", memory:"DAP = 到了目的地，但还没卸。"},
  {abbr:"DPU", full:"Delivered At Place Unloaded", cn:"目的地卸货后交货", group:"D", mode:"any", risk:92, sellerEnd:92, delivery:"货到目的地并卸货后", sellerPays:"卖方承担到目的地并卸货的费用和风险", buyerDoes:"进口清关及税费通常由买方处理", point:"唯一要求卖方负责卸货的术语", memory:"DPU = DAP 再往前一步：卖方还得卸货。"},
  {abbr:"DDP", full:"Delivered Duty Paid", cn:"完税后交货", group:"D", mode:"any", risk:98, sellerEnd:98, delivery:"目的地并完成进口责任后", sellerPays:"卖方承担几乎全部费用、风险、关税和清关", buyerDoes:"买方责任最少", point:"卖方责任最大", memory:"DDP = 税都交完了再交货。"}
];

let currentGroup = 'ALL';
let currentMode = 'ALL';
let currentSearch = '';
let active = 'FOB';
let showCN = true;
let showHint = true;

const groupOptions = [
  ['ALL','全部术语'],['E','E组'],['F','F组'],['C','C组'],['D','D组']
];
const modeOptions = [
  ['ALL','全部运输方式'],['any','任何运输方式'],['sea','仅水运']
];

const groupBtns = document.getElementById('groupBtns');
const modeBtns = document.getElementById('modeBtns');
const board = document.getElementById('board');
const detail = document.getElementById('detail');
const app = document.getElementById('app');

groupOptions.forEach(([key,label])=>{
  const b=document.createElement('button'); b.className='btn'+(key===currentGroup?' active':''); b.textContent=label;
  b.onclick=()=>{currentGroup=key;render()}; groupBtns.appendChild(b);
});
modeOptions.forEach(([key,label])=>{
  const b=document.createElement('button'); b.className='btn'+(key===currentMode?' active':''); b.textContent=label;
  b.onclick=()=>{currentMode=key;render()}; modeBtns.appendChild(b);
});

document.getElementById('toggleCN').onclick=()=>{showCN=!showCN;render()};
document.getElementById('toggleHint').onclick=()=>{showHint=!showHint;render()};
document.getElementById('search').oninput=(e)=>{currentSearch=e.target.value.trim().toLowerCase();render()};

function filteredTerms(){
  return terms.filter(t=>{
    if(currentGroup!=='ALL' && t.group!==currentGroup) return false;
    if(currentMode!=='ALL' && t.mode!==currentMode) return false;
    if(currentSearch){
      const text = [t.abbr,t.full,t.cn,t.memory,t.delivery,t.point].join(' ').toLowerCase();
      if(!text.includes(currentSearch)) return false;
    }
    return true;
  });
}

function pos(v){ return `calc(${v}% - 10px)` }

function renderBoard(list){
  board.innerHTML='';
  if(!list.length){ board.innerHTML='<div class="small">没有匹配结果，请换个关键词。</div>'; return; }
  list.forEach(t=>{
    const row=document.createElement('div'); row.className='row'+(t.abbr===active?' active':'');
    row.innerHTML=`
      <div class="rowTop">
        <div class="abbr">${t.abbr}</div>
        <div>
          <div class="full">${t.full}</div>
          <div class="cn">${t.cn}</div>
        </div>
        <div class="metaTag">${t.group}组 · ${t.mode==='sea'?'仅水运':'任何运输方式'}</div>
        <div>
          <div class="memline">${t.memory}</div>
        </div>
      </div>
      <div class="timelineWrap">
        <div class="stops">${stops.map(s=>`<div>${s}</div>`).join('')}</div>
        <div class="line">
          <div class="sellerSeg" style="width:${t.sellerEnd}%"></div>
          <div class="buyerSeg" style="left:${t.sellerEnd}%;right:0"></div>
          <div class="riskMarker" style="left:${t.risk}%">!</div>
        </div>
      </div>
      <div class="meta">
        <div class="metaTag">交货点：${t.delivery}</div>
        <div class="metaTag">关键词：${t.point}</div>
      </div>`;
    row.onclick=()=>{active=t.abbr;render()};
    board.appendChild(row);
  });
}

function renderDetail(item){
  if(!item){ detail.innerHTML=''; return; }
  detail.innerHTML=`
    <h2>${item.abbr}</h2>
    <div class="subtitle">${item.full} <span class="detail-cn">· ${item.cn}</span></div>
    <div class="groupCards" style="margin-bottom:12px">
      <div class="groupCard"><h3>一句话记忆</h3><p>${item.memory}</p></div>
      <div class="groupCard"><h3>术语定位</h3><p>${item.group}组 · ${item.mode==='sea'?'仅适用于海运/内河运输':'适用于任何运输方式'}</p></div>
    </div>
    <div class="detailGrid">
      <div class="infoBox"><h3>英文全称</h3><p>${item.full}</p></div>
      <div class="infoBox"><h3>中文含义</h3><p class="detail-cn">${item.cn}</p><p style="margin-top:6px">${item.point}</p></div>
      <div class="infoBox"><h3>交货 / 风险转移</h3><p>${item.delivery}</p></div>
      <div class="infoBox"><h3>卖方负责到哪</h3><p>${item.sellerPays}</p></div>
      <div class="infoBox"><h3>买方接手后做什么</h3><p>${item.buyerDoes}</p></div>
      <div class="infoBox"><h3>背诵提醒</h3><ul>
        <li>先记缩写 → 全称 → 中文。</li>
        <li>再记“风险在哪里转移”。</li>
        <li>最后记“卖方到底负责到哪一步”。</li>
      </ul></div>
    </div>
    <div class="memorySentence"><strong>推荐背诵顺序</strong>${item.abbr} — ${item.full} — ${item.cn} — ${item.memory}</div>
    <div class="footerNote">同类辨析：CFR/CIF 对比“是否含保险”；CPT/CIP 对比“是否含保险”；DAP/DPU 对比“是否卸货”；EXW/DDP 对比“谁责任最少/最多”。</div>
  `;
}

function render(){
  app.classList.toggle('hideCN', !showCN);
  app.classList.toggle('hideHint', !showHint);
  [...groupBtns.children].forEach((b,i)=>b.classList.toggle('active',groupOptions[i][0]===currentGroup));
  [...modeBtns.children].forEach((b,i)=>b.classList.toggle('active',modeOptions[i][0]===currentMode));
  document.getElementById('toggleCN').classList.toggle('active',showCN);
  document.getElementById('toggleCN').textContent = showCN ? '显示中文' : '隐藏中文';
  document.getElementById('toggleHint').classList.toggle('active',showHint);
  document.getElementById('toggleHint').textContent = showHint ? '显示记忆句' : '隐藏记忆句';
  const list = filteredTerms();
  if(!list.some(t=>t.abbr===active)) active = list[0]?.abbr || 'EXW';
  renderBoard(list);
  renderDetail(terms.find(t=>t.abbr===active));
}
render();
</script>
</body>
</html>
